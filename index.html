<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100 transition-colors duration-300">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-6 text-center text-2xl font-bold relative">

    User Information System (UIMS)

    <!-- DARK MODE TOGGLE -->
    <button id="themeToggle"
      class="absolute right-4 top-4 bg-white text-black px-3 py-1 rounded-lg text-sm">
       Dark Mode
    </button>

  </header>

  <!-- MAIN -->
  <main class="flex-1 flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

      <h2 class="text-xl font-bold mb-4 text-center">Enter Your Details</h2>

      <form id="userForm" class="space-y-4">

        <input id="name" type="text" placeholder="Enter name"
          class="w-full p-3 border rounded-lg" required>

        <input id="age" type="number" placeholder="Enter age"
          class="w-full p-3 border rounded-lg" required>

        <button type="submit"
          class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
          Save Data & Continue
        </button>

      </form>

      <div class="mt-6 text-sm text-gray-600">
        <p> Stores data using localStorage</p>
        <p> Calculates age in months</p>
        <p> Personalized experience</p>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-white text-center p-4">
    <p>Follow us:</p>
    <div class="space-x-4">
      <a href="#" class="text-blue-400">Facebook</a>
      <a href="#" class="text-pink-400">Instagram</a>
      <a href="#" class="text-blue-300">Twitter</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
