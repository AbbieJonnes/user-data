<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Page</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-r from-purple-500 to-pink-500">

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center relative">

      <!-- DARK MODE -->
      <button id="themeToggle"
        class="absolute top-4 right-4 bg-gray-200 text-black px-3 py-1 rounded-lg text-sm">
        <i class="fa-regular fa-moon"></i> Dark Mode
      </button>

      <h1 class="text-2xl font-bold mb-4" id="greeting"></h1>

      <p id="ageMonths" class="text-gray-700 mb-2"></p>

      <p id="adultMsg" class="font-semibold mb-4"></p>

      <h2 class="text-lg font-bold mb-2">Motivational Quotes</h2>

      <div id="quotes" class="space-y-2"></div>

      <button id="backBtn"
        class="mt-6 w-full bg-gray-700 text-white p-2 rounded-lg hover:bg-gray-800">
        Back to Dashboard
      </button>

    </div>

  </main>

  <!-- FOOTER (OUTSIDE CARD — FIXED) -->
  <footer class="w-full bg-gray-800 text-white text-center p-4">

    <p>Follow us:</p>

    <div class="space-x-6 mt-3 flex justify-center items-center">

      <a href="https://tiktok.com" class="text-blue-400 flex items-center gap-2">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>

      <a href="https://instagram.com" class="text-pink-400 flex items-center gap-2">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>

      <a href="https://x.com" class="text-white flex items-center gap-2">
        <i class="fa-brands fa-x-twitter"></i> X
      </a>

    </div>

  </footer>

  <script src="script.js"></script>
</body>
</html>
