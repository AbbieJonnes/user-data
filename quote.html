<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-500 to-pink-500 transition-colors duration-300">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center relative">

    <!-- DARK MODE TOGGLE -->
    <button id="themeToggle"
      class="absolute top-4 right-4 bg-gray-200 text-black px-3 py-1 rounded-lg text-sm">
      Dark Mode
    </button>

    <h1 class="text-2xl font-bold mb-4" id="greeting"></h1>

    <p id="ageMonths" class="text-gray-700 mb-2"></p>

    <p id="adultMsg" class="font-semibold mb-4"></p>

    <h2 class="text-lg font-bold mb-2">Motivational Quotes</h2>

    <div id="quotes" class="space-y-2"></div>

    <button id="backBtn"
      class="mt-6 w-full bg-gray-700 text-white p-2 rounded-lg hover:bg-gray-800">
      Back to Dashboard
    </button>

  </div>

  <script src="script.js"></script>
</body>
</html>
